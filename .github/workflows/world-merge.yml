# .github/workflows/world-merge.yml — Phase 6 (DESIGN.md §Phase 6). Merges the
# per-shard outputs in R2 (shards/feature/<id>/, shards/density/<id>/), the Overture
# admin build (admin/) and the global transit build (transit/) into the world the
# client reads: content-addressed layer files under world/, and world/manifest.json
# as the one mutable object, uploaded strictly last.
#
# Shape (sized against the 2026-08-22 measured shard totals):
#
#   plan ──► merge-layer (one job per layer, 36 jobs, pooled-bytes-descending so
#        │    green's ~1.7 h merge starts in the first wave)
#        └─► merge-density-band (N = ceil(cells / 30M), computed at runtime by
#             ci/merge-plan.py from the fine manifests; 4 bands today) ──► assemble-density
#   merge-layer + assemble-density ──► finalize (admin + manifest, last)
#
# Why a matrix: the serial merge measured ~5.4 h against the 6 h job cap with no
# checkpointing. Per-layer jobs also let one transient failure retry one layer.
#
# Why density is banded: GDAL's FGB writer holds ~166 MB + 100 B/feature in RAM at
# close(); one global write at 119.47M cells is ~12.1 GB against a 15 GB runner.
# Band jobs stay ~3 GB RSS; the full-grid write happens once, in assemble-density.
# If that OOMs, the durable fix is client-side multi-band density, not a bigger runner.
#
# Intermediates move through R2, never Actions artifacts: per-layer partial
# manifests and density bands stage under merge/staging/<run_id>/, cleaned up by
# finalize. Staging is keyed by run_id on purpose so "re-run failed jobs" reuses
# the succeeded jobs' staged output.
#
# /vsis3 is not used for merge output: publish_layer renames after hashing, a
# rename over /vsis3 is a CopyObject, and R2 caps single-part copy at 5 GiB, which
# water exceeds. Layers are written locally and uploaded via merge.py --upload.
#
# Upload order is load-bearing: every layer file is content-addressed and goes up
# before the manifest that names it; finalize HeadObject-verifies every referenced
# object (name and byte size) before the manifest upload.
#
# Cover exactness: the plan job refuses to merge unless the manifest set in R2
# equals shards.json's id set, both directions. A missing manifest is a shard job
# that never ran; an extra one is a stale shard whose cells were reassigned, and
# merging it double-counts density. `skip_cover_check` is the explicit escape hatch.
#
# Canary switches `only_layers`, `skip_density`, `skip_finalize` let a restricted
# merge exercise the upload paths in minutes. A full merge passes none of them.
# Guard rails:
#   - ci/merge-plan.py --only-layers hard-errors on an unknown key or one no shard
#     manifest carries;
#   - the plan job refuses `only_layers`/`skip_density` without `skip_finalize: true`,
#     since finalize cannot succeed on a restricted layer table;
#   - the live `<world_prefix>/manifest.json` is written by finalize alone. Matrix
#     jobs always pass --manifest-dest (a staging key), and merge.py refuses a
#     `partial: true` manifest at the default destination.
# A canary with skip_finalize leaves its staged manifests under
# merge/staging/<run_id>/; delete by hand or ignore (staging is per-run_id).
#
# R2 secrets required:
#   R2_ACCOUNT_ID  R2_ACCESS_KEY_ID  R2_SECRET_ACCESS_KEY  R2_BUCKET
#
# `jlumbroso/free-disk-space` is mandatory on the merge jobs: the 86.2 GB measured
# free disk is undocumented headroom, and green's merge peaks ~60 GB of transient
# disk. swap-storage is kept as insurance against the FGB writer's RAM law.
#
# Proven: run 32599689118 published the live world in 37m42s with 42/42 jobs green.
# Still unexercised: re-running a failed per-layer job that reuses another job's
# staging, which is why staging keys on run_id.

name: world-merge

on:
  workflow_dispatch:
    inputs:
      world_prefix:
        description: "R2 prefix the merged world publishes under (default: world)"
        required: false
        default: "world"
      shards_prefix:
        description: "R2 prefix the shard outputs live under (default: shards)"
        required: false
        default: "shards"
      admin_prefix:
        description: "R2 prefix world-admin.yml uploaded admin.fgb under (default: admin)"
        required: false
        default: "admin"
      transit_prefix:
        description: "R2 prefix world-transit.yml uploaded transit_route.fgb under (default: transit)"
        required: false
        default: "transit"
      cells_per_band:
        description: "Density cells per merge band (default 30M ≈ 3 GB RSS/band)"
        required: false
        default: "30000000"
      skip_cover_check:
        description: "Set 'true' to merge even when the R2 manifest set does not equal shards.json (DELIBERATE partial/stale merges only)"
        required: false
        default: "false"
      only_layers:
        description: "CANARY: comma-separated layer keys to merge (empty = all). Requires skip_finalize=true"
        required: false
        default: ""
      skip_density:
        description: "CANARY: 'true' skips the density band + assemble jobs. Requires skip_finalize=true"
        required: false
        default: "false"
      skip_finalize:
        description: "CANARY: 'true' skips finalize — nothing touches the live manifest"
        required: false
        default: "false"
  # Callable from world-rebuild.yml with the same inputs.
  workflow_call:
    inputs:
      world_prefix:
        required: false
        type: string
        default: "world"
      shards_prefix:
        required: false
        type: string
        default: "shards"
      admin_prefix:
        required: false
        type: string
        default: "admin"
      transit_prefix:
        required: false
        type: string
        default: "transit"
      cells_per_band:
        required: false
        type: string
        default: "30000000"
      skip_cover_check:
        required: false
        type: string
        default: "false"
      only_layers:
        required: false
        type: string
        default: ""
      skip_density:
        required: false
        type: string
        default: "false"
      skip_finalize:
        required: false
        type: string
        default: "false"

concurrency:
  group: world-merge
  cancel-in-progress: false

env:
  WORLD_PREFIX: ${{ inputs.world_prefix || 'world' }}
  SHARDS_PREFIX: ${{ inputs.shards_prefix || 'shards' }}
  ADMIN_PREFIX: ${{ inputs.admin_prefix || 'admin' }}
  TRANSIT_PREFIX: ${{ inputs.transit_prefix || 'transit' }}
  CELLS_PER_BAND: ${{ inputs.cells_per_band || '30000000' }}
  SKIP_COVER_CHECK: ${{ inputs.skip_cover_check || 'false' }}
  ONLY_LAYERS: ${{ inputs.only_layers || '' }}
  SKIP_DENSITY: ${{ inputs.skip_density || 'false' }}
  SKIP_FINALIZE: ${{ inputs.skip_finalize || 'false' }}
  # run_id, not run_attempt, so re-run failed jobs reuse staged output.
  STAGING: merge/staging/${{ github.run_id }}
  # aws-cli v2.23+ defaults to CRC checksums some S3-compatibles reject.
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  AWS_DEFAULT_REGION: auto

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      layers_matrix: ${{ steps.plan.outputs.layers_matrix }}
      bands_matrix: ${{ steps.plan.outputs.bands_matrix }}
      bands: ${{ steps.plan.outputs.bands }}
      cells: ${{ steps.plan.outputs.cells }}
    steps:
      - uses: actions/checkout@v7

      - name: runner envelope (this build depends on undocumented headroom)
        run: |
          set -euo pipefail
          echo "cores: $(nproc)   ram: $(free -g | awk '/^Mem:/{print $2}') GB"
          df -Pk . | awk 'NR==2{printf "disk: %.1f GB free of %.1f GB\n", $4/1048576, $2/1048576}'
          # GitHub documents 14 GB of runner storage but ships far more; printing it
          # every run makes a silent reversion visible before ENOSPC does.
          free_gb=$(df -Pk . | awk 'NR==2{print int($4/1048576)}')
          [ "$free_gb" -ge 20 ] || echo "::warning::only ${free_gb} GB free — large shards may not fit"

      - name: plan the matrices from the shard manifests in R2
        id: plan
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # A restricted run can never finalize (merge.py --assemble-manifests
          # refuses an incomplete layer table); refuse now, not after hours of jobs.
          if [ "$SKIP_FINALIZE" != "true" ] && { [ -n "$ONLY_LAYERS" ] || [ "$SKIP_DENSITY" = "true" ]; }; then
            echo "::error::only_layers/skip_density are canary switches and require skip_finalize=true — a restricted merge cannot produce the full layer table finalize insists on, so it would fail there after all the merge jobs ran"
            exit 1
          fi
          missing=()
          for v in R2_ACCOUNT_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_BUCKET; do
            [ -n "${!v:-}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing secrets: ${missing[*]} — the R2_* secrets must exist before anything can merge"
            exit 1
          fi
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          # Manifests only: ~600 small JSONs describing what the shard workflows produced.
          aws s3 sync "s3://$R2_BUCKET/$SHARDS_PREFIX/feature/" mf/feature/ \
            --endpoint-url "$EP" --no-progress \
            --exclude '*' --include '*/manifest.json'

          PLAN_FLAGS=()
          if [ "$SKIP_DENSITY" = "true" ]; then
            PLAN_FLAGS+=(--skip-density)
          else
            aws s3 sync "s3://$R2_BUCKET/$SHARDS_PREFIX/density/" mf/density/ \
              --endpoint-url "$EP" --no-progress \
              --exclude '*' --include '*/manifest.json'
            PLAN_FLAGS+=(--density-manifests mf/density)
          fi
          if [ -n "$ONLY_LAYERS" ]; then
            PLAN_FLAGS+=(--only-layers "$ONLY_LAYERS")
          fi
          if [ "$SKIP_COVER_CHECK" = "true" ]; then
            PLAN_FLAGS+=(--skip-cover-check)
            echo "::warning::skip_cover_check=true — merging whatever manifests exist; counts may be short or stale"
          fi
          python3 tools/osm-world/ci/merge-plan.py \
            --feature-manifests mf/feature \
            --cells-per-band "$CELLS_PER_BAND" \
            "${PLAN_FLAGS[@]}" \
            > plan.json

          {
            echo "layers_matrix<<PLANEOF"
            jq -c '.layers_matrix' plan.json
            echo "PLANEOF"
            echo "bands_matrix<<PLANEOF"
            jq -c '.bands_matrix' plan.json
            echo "PLANEOF"
            echo "bands=$(jq -r '.bands' plan.json)"
            echo "cells=$(jq -r '.cells' plan.json)"
          } >> "$GITHUB_OUTPUT"

      - name: summary
        env:
          LAYERS_MATRIX: ${{ steps.plan.outputs.layers_matrix }}
        run: |
          set -euo pipefail
          {
            echo "### world-merge plan"
            if [ "$SKIP_DENSITY" = "true" ]; then
              echo "- density: SKIPPED (canary)"
            else
              echo "- ${{ steps.plan.outputs.cells }} density cells → ${{ steps.plan.outputs.bands }} band(s) at $CELLS_PER_BAND/band (computed at runtime, never hard-coded)"
            fi
            if [ -n "$ONLY_LAYERS" ]; then
              echo "- CANARY: only $(echo "$LAYERS_MATRIX" | jq -r '[.[].layer] | join(", ")') ($(echo "$LAYERS_MATRIX" | jq 'length') layer job(s))"
            else
              echo "- $(echo "$LAYERS_MATRIX" | jq 'length') layer jobs, pooled-bytes-descending"
            fi
            [ "$SKIP_FINALIZE" != "true" ] || echo "- finalize: SKIPPED — the live manifest will not be touched"
            echo "- staging under \`$STAGING\` in R2"
          } >> "$GITHUB_STEP_SUMMARY"

  merge-layer:
    name: merge (${{ matrix.layer }})
    needs: plan
    runs-on: ubuntu-latest
    # green is the bound (~14.22 GB pooled, ~1.7 h merge + ~15 min sync), doubled
    # by the retry-once wrapper. 330 min covers that under the 6 h cap.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      # 20 keeps headroom under the 40-concurrent account ceiling.
      max-parallel: 20
      matrix:
        include: ${{ fromJson(needs.plan.outputs.layers_matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: runner envelope (this build depends on undocumented headroom)
        run: |
          set -euo pipefail
          echo "cores: $(nproc)   ram: $(free -g | awk '/^Mem:/{print $2}') GB"
          df -Pk . | awk 'NR==2{printf "disk: %.1f GB free of %.1f GB\n", $4/1048576, $2/1048576}'
          # GitHub documents 14 GB of runner storage but ships far more; printing it
          # every run makes a silent reversion visible before ENOSPC does.
          free_gb=$(df -Pk . | awk 'NR==2{print int($4/1048576)}')
          [ "$free_gb" -ge 20 ] || echo "::warning::only ${free_gb} GB free — large shards may not fit"

      - name: free disk space (MANDATORY on merge jobs — DESIGN.md §Phase 6)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          # +~31 GB in ~3 min. green's merge peaks ~60 GB of transient disk.
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          # Keep swap: insurance against the FGB writer exceeding its RAM law.
          swap-storage: false

      - name: install gdal, uv
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends gdal-bin
          # Driver preflight: these four are what merge.py reads/writes; fail by name now.
          # Plain grep, not -q: under pipefail -q's early exit SIGPIPEs ogrinfo.
          for drv in FlatGeobuf GPKG CSV GeoJSONSeq; do
            ogrinfo --formats 2>/dev/null | grep "$drv" >/dev/null \
              || { echo "::error::this GDAL lacks the $drv driver"; exit 1; }
          done
          python3 -m pip install --user --upgrade uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: sync shard inputs and merge this layer
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          LAYER: ${{ matrix.layer }}
        run: |
          set -euo pipefail
          missing=()
          for v in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            [ -n "${!v:-}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing secrets: ${missing[*]}"
            exit 1
          fi
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          TREE="$RUNNER_TEMP/shards-feature"
          OUT="$RUNNER_TEMP/merge-out"
          expected=$(jq '.coarse | length' tools/osm-world/shards.json)

          merge_layer() {
            rm -rf "$TREE" "$OUT"
            mkdir -p "$TREE"
            # Only this layer's file per shard, plus every manifest. The '/' anchor
            # matters: '*/water.fgb' must not match curse_water.fgb. Downloads use
            # the S3 API, never the CDN, which may hold a stale cached copy.
            aws s3 sync "s3://$R2_BUCKET/$SHARDS_PREFIX/feature/" "$TREE/" \
              --endpoint-url "$EP" --no-progress \
              --exclude '*' \
              --include '*/manifest.json' \
              --include "*/${LAYER}.fgb"
            found=$(find "$TREE" -name manifest.json | wc -l)
            if [ "$found" -ne "$expected" ]; then
              echo "::error::synced $found feature shard manifests but shards.json expects $expected — the shard set changed since the plan job's cover check, or the sync was cut short"
              return 1
            fi
            # Layer file straight to the world prefix (content-addressed, safe before
            # the manifest); partial manifest to STAGING, never the live manifest.json.
            uv run tools/osm-world/merge.py \
              --shards "$TREE" \
              --out "$OUT" \
              --only "$LAYER" \
              --upload \
              --prefix "$WORLD_PREFIX" \
              --manifest-dest "$STAGING/manifests/${LAYER}.manifest.json"
          }

          # A retry is a full re-sync + re-merge, for transient failures only; a
          # deterministic merge failure fails twice.
          attempt=1
          max_attempts=2
          until merge_layer; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::layer $LAYER failed after $attempt attempt(s)"
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "::warning::layer $LAYER failed, retrying (attempt $attempt/$max_attempts)"
            sleep 10
          done
          echo "- \`$LAYER\` merged and uploaded (staged manifest: \`$STAGING/manifests/$LAYER.manifest.json\`)" >> "$GITHUB_STEP_SUMMARY"

  merge-density-band:
    name: density band (${{ matrix.band }}/${{ matrix.bands }})
    needs: plan
    # With skip_density the plan emits an empty bands_matrix, which a matrix job
    # would reject, so the whole job is skipped.
    if: ${{ (inputs.skip_density || 'false') != 'true' }}
    runs-on: ubuntu-latest
    # ~35 min/band at 30M cells plus ~10 min of sync, doubled by the retry-once wrapper.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJson(needs.plan.outputs.bands_matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: runner envelope (this build depends on undocumented headroom)
        run: |
          set -euo pipefail
          echo "cores: $(nproc)   ram: $(free -g | awk '/^Mem:/{print $2}') GB"
          df -Pk . | awk 'NR==2{printf "disk: %.1f GB free of %.1f GB\n", $4/1048576, $2/1048576}'
          # GitHub documents 14 GB of runner storage but ships far more; printing it
          # every run makes a silent reversion visible before ENOSPC does.
          free_gb=$(df -Pk . | awk 'NR==2{print int($4/1048576)}')
          [ "$free_gb" -ge 20 ] || echo "::warning::only ${free_gb} GB free — large shards may not fit"

      - name: free disk space (MANDATORY on merge jobs — DESIGN.md §Phase 6)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          # Band jobs peak ~45 GB; the margin is undocumented headroom, hence mandatory.
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: install gdal, uv
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends gdal-bin
          # Driver preflight: these four are what merge.py reads/writes; fail by name now.
          # Plain grep, not -q: under pipefail -q's early exit SIGPIPEs ogrinfo.
          for drv in FlatGeobuf GPKG CSV GeoJSONSeq; do
            ogrinfo --formats 2>/dev/null | grep "$drv" >/dev/null \
              || { echo "::error::this GDAL lacks the $drv driver"; exit 1; }
          done
          python3 -m pip install --user --upgrade uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: sync density shards and merge this band
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BAND: ${{ matrix.band }}
          BANDS: ${{ matrix.bands }}
        run: |
          set -euo pipefail
          missing=()
          for v in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            [ -n "${!v:-}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing secrets: ${missing[*]}"
            exit 1
          fi
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          TREE="$RUNNER_TEMP/shards-density"
          OUT="$RUNNER_TEMP/band-out"
          expected=$(jq '.fine | length' tools/osm-world/shards.json)

          merge_band() {
            rm -rf "$TREE" "$OUT"
            mkdir -p "$TREE"
            aws s3 sync "s3://$R2_BUCKET/$SHARDS_PREFIX/density/" "$TREE/" \
              --endpoint-url "$EP" --no-progress \
              --exclude '*' \
              --include '*/manifest.json' \
              --include '*/density.fgb'
            found=$(find "$TREE" -name manifest.json | wc -l)
            if [ "$found" -ne "$expected" ]; then
              echo "::error::synced $found density shard manifests but shards.json expects $expected — the shard set changed since the plan job's cover check, or the sync was cut short"
              return 1
            fi
            # Band file first, sidecar last (the completeness marker assemble-density
            # trusts), both into staging.
            uv run tools/osm-world/merge.py \
              --shards "$TREE" \
              --out "$OUT" \
              --only density \
              --density-band "$BAND/$BANDS" \
              --upload \
              --prefix "$STAGING/density-bands"
          }

          attempt=1
          max_attempts=2
          until merge_band; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::density band $BAND/$BANDS failed after $attempt attempt(s)"
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "::warning::density band $BAND/$BANDS failed, retrying (attempt $attempt/$max_attempts)"
            sleep 10
          done
          echo "- density band \`$BAND/$BANDS\` staged" >> "$GITHUB_STEP_SUMMARY"

  assemble-density:
    needs: [plan, merge-density-band]
    if: ${{ (inputs.skip_density || 'false') != 'true' }}
    runs-on: ubuntu-latest
    # The one full-grid FGB write: ~12.1 GB RAM at 119.47M cells against 15 GB.
    # An OOM here means client-side multi-band density is due. Wall is a pure VRT
    # append, under ~2.9 h; no in-script retry, since two would not fit under the
    # 6 h cap and the failure modes here are not transient.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      - name: runner envelope (this build depends on undocumented headroom)
        run: |
          set -euo pipefail
          echo "cores: $(nproc)   ram: $(free -g | awk '/^Mem:/{print $2}') GB"
          df -Pk . | awk 'NR==2{printf "disk: %.1f GB free of %.1f GB\n", $4/1048576, $2/1048576}'
          # GitHub documents 14 GB of runner storage but ships far more; printing it
          # every run makes a silent reversion visible before ENOSPC does.
          free_gb=$(df -Pk . | awk 'NR==2{print int($4/1048576)}')
          [ "$free_gb" -ge 20 ] || echo "::warning::only ${free_gb} GB free — large shards may not fit"

      - name: free disk space (MANDATORY on merge jobs — DESIGN.md §Phase 6)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          # ~15 GB of bands in + ~15 GB out + the writer's hidden ~2× temp.
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: install gdal, uv
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends gdal-bin
          # Driver preflight: these four are what merge.py reads/writes; fail by name now.
          # Plain grep, not -q: under pipefail -q's early exit SIGPIPEs ogrinfo.
          for drv in FlatGeobuf GPKG CSV GeoJSONSeq; do
            ogrinfo --formats 2>/dev/null | grep "$drv" >/dev/null \
              || { echo "::error::this GDAL lacks the $drv driver"; exit 1; }
          done
          python3 -m pip install --user --upgrade uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: assemble the density bands into the global grid
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for v in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            [ -n "${!v:-}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing secrets: ${missing[*]}"
            exit 1
          fi
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          BANDS_DIR="$RUNNER_TEMP/density-bands"
          OUT="$RUNNER_TEMP/assemble-out"
          rm -rf "$BANDS_DIR" "$OUT"
          mkdir -p "$BANDS_DIR"
          aws s3 sync "s3://$R2_BUCKET/$STAGING/density-bands/" "$BANDS_DIR/" \
            --endpoint-url "$EP" --no-progress
          # merge.py validates the band SET (exactly K=1..N, sidecars present,
          # one N) and refuses a cell-count mismatch — a lost band must never
          # publish a silently short grid. The assembled density.<sha>.fgb goes
          # to the world prefix; the partial manifest to staging.
          uv run tools/osm-world/merge.py \
            --assemble-density-bands "$BANDS_DIR" \
            --out "$OUT" \
            --upload \
            --prefix "$WORLD_PREFIX" \
            --manifest-dest "$STAGING/manifests/density.manifest.json"
          echo "- density assembled from $(find "$BANDS_DIR" -maxdepth 1 -name '*.fgb' | wc -l) band(s)" >> "$GITHUB_STEP_SUMMARY"

  finalize:
    needs: [plan, merge-layer, assemble-density]
    # skip_finalize is the only switch that skips this job. The needs-chain stays
    # plain (no always()): if any dependency failed, this job is skipped and the
    # live manifest stays untouched.
    if: ${{ (inputs.skip_finalize || 'false') != 'true' }}
    runs-on: ubuntu-latest
    # Downloads admin and transit, ~40 HeadObjects, uploads them + one manifest.
    # No free-disk-space: this job peaks ~5 GB of disk.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: runner envelope (this build depends on undocumented headroom)
        run: |
          set -euo pipefail
          echo "cores: $(nproc)   ram: $(free -g | awk '/^Mem:/{print $2}') GB"
          df -Pk . | awk 'NR==2{printf "disk: %.1f GB free of %.1f GB\n", $4/1048576, $2/1048576}'
          # GitHub documents 14 GB of runner storage but ships far more; printing it
          # every run makes a silent reversion visible before ENOSPC does.
          free_gb=$(df -Pk . | awk 'NR==2{print int($4/1048576)}')
          [ "$free_gb" -ge 20 ] || echo "::warning::only ${free_gb} GB free — large shards may not fit"

      # GDAL is needed here too: merge.py --assemble-manifests shells out to
      # ogrinfo for the admin layer's feature count and bbox.
      - name: install gdal, uv
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends gdal-bin
          # Driver preflight: these four are what merge.py reads/writes; fail by name now.
          # Plain grep, not -q: under pipefail -q's early exit SIGPIPEs ogrinfo.
          for drv in FlatGeobuf GPKG CSV GeoJSONSeq; do
            ogrinfo --formats 2>/dev/null | grep "$drv" >/dev/null \
              || { echo "::error::this GDAL lacks the $drv driver"; exit 1; }
          done
          python3 -m pip install --user --upgrade uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: assemble and publish the world manifest (admin first, manifest last)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for v in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            [ -n "${!v:-}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing secrets: ${missing[*]}"
            exit 1
          fi
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          STAGED="$RUNNER_TEMP/staged-manifests"
          ADMIN_DIR="$RUNNER_TEMP/admin"
          TRANSIT_DIR="$RUNNER_TEMP/transit"
          OUT="$RUNNER_TEMP/final-out"
          rm -rf "$STAGED" "$ADMIN_DIR" "$TRANSIT_DIR" "$OUT"
          mkdir -p "$STAGED" "$ADMIN_DIR" "$TRANSIT_DIR"

          aws s3 sync "s3://$R2_BUCKET/$STAGING/manifests/" "$STAGED/" \
            --endpoint-url "$EP" --no-progress

          # The Overture admin build, verified against its sha256 sidecar.
          if ! aws s3 cp "s3://$R2_BUCKET/$ADMIN_PREFIX/admin.fgb" \
              "$ADMIN_DIR/admin.fgb" --endpoint-url "$EP" --no-progress; then
            echo "::error::no admin build at s3://\$R2_BUCKET/$ADMIN_PREFIX/admin.fgb — dispatch world-admin.yml first"
            exit 1
          fi
          aws s3 cp "s3://$R2_BUCKET/$ADMIN_PREFIX/admin.fgb.sha256" \
            "$ADMIN_DIR/admin.fgb.sha256" --endpoint-url "$EP" --no-progress
          (cd "$ADMIN_DIR" && sha256sum -c admin.fgb.sha256)

          # The global transit_route build, verified the same way. merge.py requires
          # --transit wherever it requires --admin, so a missing build fails by name.
          if ! aws s3 cp "s3://$R2_BUCKET/$TRANSIT_PREFIX/transit_route.fgb" \
              "$TRANSIT_DIR/transit_route.fgb" --endpoint-url "$EP" --no-progress; then
            echo "::error::no transit build at s3://\$R2_BUCKET/$TRANSIT_PREFIX/transit_route.fgb — dispatch world-transit.yml first"
            exit 1
          fi
          aws s3 cp "s3://$R2_BUCKET/$TRANSIT_PREFIX/transit_route.fgb.sha256" \
            "$TRANSIT_DIR/transit_route.fgb.sha256" --endpoint-url "$EP" --no-progress
          (cd "$TRANSIT_DIR" && sha256sum -c transit_route.fgb.sha256)

          # merge.py refuses an incomplete layer table, HeadObject-verifies every
          # staged layer in R2, uploads admin and transit, then the live manifest last.
          uv run tools/osm-world/merge.py \
            --assemble-manifests "$STAGED" \
            --admin "$ADMIN_DIR/admin.fgb" \
            --transit "$TRANSIT_DIR/transit_route.fgb" \
            --out "$OUT" \
            --upload \
            --prefix "$WORLD_PREFIX"

          {
            echo "### world published"
            echo "- \`$WORLD_PREFIX/manifest.json\` is live (${{ needs.plan.outputs.cells }} density cells, ${{ needs.plan.outputs.bands }} bands)"
            echo '```'
            python3 -c "import json; m=json.load(open('$OUT/manifest.json')); print('planet_timestamp:', m['planet_timestamp']); print(len(m['layers']), 'layers')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: clean up staging intermediates
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # The world is already live; a failed cleanup must warn, not fail the run.
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # No --no-progress here: `aws s3 rm` rejects it as an unknown option.
          aws s3 rm "s3://$R2_BUCKET/$STAGING/" --recursive --endpoint-url "$EP" \
            || echo "::warning::staging cleanup failed — orphaned intermediates remain under $STAGING/ in R2; delete them by hand"
          # Verify rather than trust the exit code. The `|| true` is required:
          # `aws s3 ls` exits 1 on an empty listing, which is the success case.
          left=$( (aws s3 ls "s3://$R2_BUCKET/$STAGING/" --recursive \
                   --endpoint-url "$EP" || true) | wc -l)
          [ "$left" -eq 0 ] \
            || echo "::warning::$left object(s) still under $STAGING/ in R2 after cleanup; delete them by hand"
