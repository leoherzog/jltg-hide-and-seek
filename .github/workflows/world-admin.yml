# .github/workflows/world-admin.yml — Phase 2 in CI (DESIGN.md §Phase 2, §Phase 6).
# Builds the global `admin` layer from Overture `division_area`, not OSM: admin
# relations only assemble into polygons when they fit inside an extract, so a
# per-shard OSM build never yields a country polygon. Overture ships them assembled.
#
# Drives tools/osm-world/build-admin.sh unchanged, then runs both validation gates
# before anything uploads:
#   1. build-admin.sh's own ogrinfo probes (Grand Rapids → US, Basel → CH+DE+FR),
#   2. probe-admin.mjs: 39 assertions through the real client reader, including
#      the Vatican enclave and Baarle.
#
# Output goes to a stable prefix (default `admin/`): admin.fgb, its sha256 sidecar
# (uploaded after the fgb so a torn upload fails world-merge's `sha256sum -c`), and
# admin.meta.json recording the pinned release. These are pipeline intermediates
# uploaded with aws-cli; published world objects go through merge.py's uploader.
#
# Sizing (measured on kadro 16-core/31 GB; runner is 4-core/15 GB): DuckDB peak RSS
# 6.3 GB at SIMPLIFY=0.0001, MEMORY_LIMIT 10GB with spill to $OUT/duckdb-tmp. The
# source parquet is streamed over httpfs; disk use is ~15 GB, so no free-disk step.
# Wall is minutes to tens of minutes on a runner. Run rarely, by hand; nothing
# schedules it, world-rebuild.yml calls it.
#
# Overture prunes old releases. build-admin.sh checks the listing first and fails
# naming what still exists; re-pin `release` when that fires and review the
# probe-admin.mjs expectations (ground truth for 2026-07-22.0).
#
# R2 secrets required:
#   R2_ACCOUNT_ID  R2_ACCESS_KEY_ID  R2_SECRET_ACCESS_KEY  R2_BUCKET
#
# Behaviour is unverified until dispatched.

name: world-admin

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Overture release id (pinned; build fails loudly listing live releases if pruned)"
        required: false
        default: "2026-07-22.0"
      simplify:
        description: "ST_SimplifyPreserveTopology tolerance in degrees (S2 shipped 0.0001; empty = full precision, ~2.6x larger)"
        required: false
        default: "0.0001"
      admin_prefix:
        description: "Stable R2 prefix for the handoff to world-merge.yml (default: admin)"
        required: false
        default: "admin"
  # Callable from world-rebuild.yml with the same inputs.
  workflow_call:
    inputs:
      release:
        required: false
        type: string
        default: "2026-07-22.0"
      simplify:
        required: false
        type: string
        default: "0.0001"
      admin_prefix:
        required: false
        type: string
        default: "admin"

concurrency:
  group: world-admin
  cancel-in-progress: false

env:
  REL: ${{ inputs.release || '2026-07-22.0' }}
  SIMPLIFY: ${{ inputs.simplify || '0.0001' }}
  ADMIN_PREFIX: ${{ inputs.admin_prefix || 'admin' }}
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  AWS_DEFAULT_REGION: auto
  # Pinned to the 1.4.x LTS line on purpose: 1.5.0–1.5.3 could wrongly prune
  # parquet row groups on geometry stats, silently dropping division polygons.
  # Bump deliberately, with the release notes in hand.
  DUCKDB_VERSION: "1.4.5"

jobs:
  build-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: runner envelope (this build depends on undocumented headroom)
        run: |
          set -euo pipefail
          echo "cores: $(nproc)   ram: $(free -g | awk '/^Mem:/{print $2}') GB"
          df -Pk . | awk 'NR==2{printf "disk: %.1f GB free of %.1f GB\n", $4/1048576, $2/1048576}'
          # GitHub documents 14 GB of runner storage but ships far more; printing it
          # every run makes a silent reversion visible before ENOSPC does.
          free_gb=$(df -Pk . | awk 'NR==2{print int($4/1048576)}')
          [ "$free_gb" -ge 20 ] || echo "::warning::only ${free_gb} GB free — large shards may not fit"

      - name: preflight R2 secrets (before a 20-minute build, not after)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          missing=()
          for v in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            [ -n "${!v:-}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing secrets: ${missing[*]} — the upload step would fail after the whole build"
            exit 1
          fi

      - name: install gdal, duckdb
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends gdal-bin unzip
          curl -fL --retry 5 --retry-connrefused --retry-delay 3 \
            -o /tmp/duckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
          unzip -o /tmp/duckdb.zip -d /tmp/duckdb-cli
          sudo install /tmp/duckdb-cli/duckdb /usr/local/bin/duckdb
          duckdb --version

      - name: build admin.fgb from Overture (build-admin.sh, probes included)
        run: |
          set -euo pipefail
          # MEMORY_LIMIT 10GB on a 15 GB runner; DuckDB spills to $OUT/duckdb-tmp and
          # writes admin.fgb directly (apt GDAL ships no Parquet driver).
          OUT="$RUNNER_TEMP/admin-build" \
          REL="$REL" \
          SIMPLIFY="$SIMPLIFY" \
          MEMORY_LIMIT=10GB \
            bash tools/osm-world/build-admin.sh

      - name: validate through the real client reader (probe-admin.mjs)
        run: |
          set -euo pipefail
          # Exit 1 here means do not publish; nothing has been uploaded yet.
          node tools/osm-world/probe-admin.mjs "$RUNNER_TEMP/admin-build/admin.fgb"

      - name: upload to the stable handoff prefix (fgb, then sidecar, then meta)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          OUT="$RUNNER_TEMP/admin-build"

          # Meta first, locally: the release id drives the served ODbL attribution.
          python3 - "$OUT" "$REL" "$SIMPLIFY" <<'PY'
          import json, sys, time
          from pathlib import Path
          out, rel, simplify = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          sha = out.joinpath("admin.fgb.sha256").read_text().split()[0]
          out.joinpath("admin.meta.json").write_text(json.dumps({
              "release": rel,
              "simplify": simplify,
              "sha256": sha,
              "bytes": out.joinpath("admin.fgb").stat().st_size,
              "built_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
          }, indent=2, sort_keys=True) + "\n")
          PY

          # Order matters: fgb, then the sha sidecar, so a torn upload fails
          # world-merge's `sha256sum -c` instead of merging a half-replaced file.
          for name in admin.fgb admin.fgb.sha256 admin.meta.json; do
            aws s3 cp "$OUT/$name" "s3://$R2_BUCKET/$ADMIN_PREFIX/$name" \
              --endpoint-url "$EP" --no-progress
          done

          {
            echo "### world-admin"
            echo "- Overture \`$REL\`, SIMPLIFY=\`$SIMPLIFY\` → \`$ADMIN_PREFIX/admin.fgb\`"
            echo '```'
            cat "$OUT/admin.meta.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
