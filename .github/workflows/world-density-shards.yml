# .github/workflows/world-density-shards.yml — Phase 4 (DESIGN.md §Phase 4). Builds
# the density grid only (build.py --only density) for every "fine" shard in
# tools/osm-world/shards.json and uploads each shard's output to R2 under
# shards/density/<id>/.
#
# Density exactness: build-shard.sh passes each shard's assigned disjoint polygon
# (tools/osm-world/cover-geometries/<id with '/' -> '__'>.geojson) to build.py
# --clip-region, so a way is counted only where its first node falls inside that
# region. Geofabrik extracts overlap; without the clip, merge.py's cell sums
# double-count every way in the buffers. cover-geometries/ and shards.json come from
# the same cover.py run — regenerate and commit them together.
#
# This workflow does not merge shards. Merge runs on kadro:
#
#   uv run tools/osm-world/merge.py --shards <dir with one subdir per shard build> \
#     --admin <overture admin.fgb> --out <dir>
#
# To pull shard outputs from R2 into that shape:
#
#   aws s3 sync s3://$R2_BUCKET/shards/density/ ./shards/density/ \
#     --endpoint-url https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com
#
# R2 secrets required:
#   R2_ACCOUNT_ID  R2_ACCESS_KEY_ID  R2_SECRET_ACCESS_KEY  R2_BUCKET
# The .dev.vars token lacks R2 write; a CI-scoped R2 token must be minted and stored
# as those four secrets. Without them a dispatch builds and fails at upload.
#
# Cost model (DESIGN.md §Phase 4), confirmed by a full-scale run on 2026-08-22
# (113/113 jobs, zero failures):
#   - Density shards fit easily: <=~5 GB RSS worst case (quebec), ~1.2 GB disk.
#   - Public repos get unlimited included Actions minutes; check pricing for private.
#   - Matrix hard cap is 256 jobs/workflow, hence batching. Batches are capped by
#     count (5) and by accumulated est_bytes (2 GB): the density pass is
#     single-threaded, so wall clock tracks bytes. 514 fine shards -> 113 jobs; the
#     five shards over 2 GB (africa, canada, south-america, us-midwest, italy) each
#     get a job of their own.
#   - Concurrency: 20 (Free tier) / 40 (Pro). Raise max-parallel if there is headroom.

name: world-density-shards

on:
  # Schedule disabled until the R2_* secrets exist; every job would fail at upload.
  # Re-arm by uncommenting the two live lines (monthly, 06:00 UTC on the 3rd).
  # schedule:
  #   - cron: "0 6 3 * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Max fine shards per matrix job (default 5; with the byte cap, 514 shards = 113 jobs)"
        required: false
        default: "5"
      max_batch_bytes:
        description: "Max accumulated est_bytes per matrix job (default 2 GB; a single larger shard still runs, alone)"
        required: false
        default: "2000000000"
  # Callable from world-rebuild.yml, same inputs. `inputs.*` covers both triggers;
  # `github.event.inputs.*` would read the caller's dispatch inputs under workflow_call.
  workflow_call:
    inputs:
      batch_size:
        required: false
        type: string
        default: "5"
      max_batch_bytes:
        required: false
        type: string
        default: "2000000000"

concurrency:
  group: world-density-shards
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.chunk.outputs.matrix }}
      count: ${{ steps.chunk.outputs.count }}
    steps:
      - uses: actions/checkout@v7

      - name: runner envelope (this build depends on undocumented headroom)
        run: |
          set -euo pipefail
          echo "cores: $(nproc)   ram: $(free -g | awk '/^Mem:/{print $2}') GB"
          df -Pk . | awk 'NR==2{printf "disk: %.1f GB free of %.1f GB\n", $4/1048576, $2/1048576}'
          # GitHub documents 14 GB of runner storage but ships far more; printing it
          # every run makes a silent reversion visible before ENOSPC does.
          free_gb=$(df -Pk . | awk 'NR==2{print int($4/1048576)}')
          [ "$free_gb" -ge 20 ] || echo "::warning::only ${free_gb} GB free — large shards may not fit"


      - name: chunk shards.json into a matrix
        id: chunk
        env:
          BATCH_SIZE: ${{ inputs.batch_size || '5' }}
          MAX_BATCH_BYTES: ${{ inputs.max_batch_bytes || '2000000000' }}
        run: |
          set -euo pipefail
          if [ ! -f tools/osm-world/shards.json ]; then
            echo "::error::tools/osm-world/shards.json not found — run cover.py (Phase 3) and commit it first"
            exit 1
          fi
          python3 tools/osm-world/ci/chunk-shards.py \
            --kind fine \
            --batch-size "$BATCH_SIZE" \
            --max-batch-bytes "$MAX_BATCH_BYTES" \
            --max-jobs 256 \
            > matrix.json
          {
            echo "matrix<<CHUNKEOF"
            cat matrix.json
            echo "CHUNKEOF"
          } >> "$GITHUB_OUTPUT"
          echo "count=$(jq 'length' matrix.json)" >> "$GITHUB_OUTPUT"

      - name: summary
        run: |
          echo "### world-density-shards" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.chunk.outputs.count }} batch job(s) from tools/osm-world/shards.json[\"fine\"]" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build (${{ matrix.batch_id }})
    needs: setup
    runs-on: ubuntu-latest
    # ~15 min/GB measured; the bound is africa (7.90 GB ≈ 2 h) doubled by the
    # retry-once wrapper. 350 min covers that and stays under the 6-hour job cap.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # 20 = Free-tier concurrent-job ceiling; raise to 40 where there is headroom.
      max-parallel: 20
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: runner envelope (this build depends on undocumented headroom)
        run: |
          set -euo pipefail
          echo "cores: $(nproc)   ram: $(free -g | awk '/^Mem:/{print $2}') GB"
          df -Pk . | awk 'NR==2{printf "disk: %.1f GB free of %.1f GB\n", $4/1048576, $2/1048576}'
          # GitHub documents 14 GB of runner storage but ships far more; printing it
          # every run makes a silent reversion visible before ENOSPC does.
          free_gb=$(df -Pk . | awk 'NR==2{print int($4/1048576)}')
          [ "$free_gb" -ge 20 ] || echo "::warning::only ${free_gb} GB free — large shards may not fit"


      - name: install osmium-tool, gdal, uv
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends osmium-tool gdal-bin time
          # Driver preflight: a GDAL can lack a driver build.py needs; fail by name now.
          # Plain grep, not -q: under pipefail -q's early exit SIGPIPEs ogrinfo.
          for drv in FlatGeobuf GeoJSONSeq; do
            ogrinfo --formats 2>/dev/null | grep "$drv" >/dev/null \
              || { echo "::error::this GDAL lacks the $drv driver"; exit 1; }
          done
          python3 -m pip install --user --upgrade uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: build + upload every shard in this batch
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BATCH_JSON: ${{ toJson(matrix.shards) }}
        run: |
          set -euo pipefail
          chmod +x tools/osm-world/ci/build-shard.sh

          missing=()
          for v in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            [ -n "${!v:-}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing secrets: ${missing[*]} — see this file's header comment (a CI R2 token must be minted; .dev.vars' token lacks R2 write)"
            exit 1
          fi

          echo "$BATCH_JSON" | jq -c '.[]' | while IFS= read -r shard; do
            id="$(echo "$shard" | jq -r '.id')"
            pbf_url="$(echo "$shard" | jq -r '.pbf_url')"
            md5_url="$(echo "$shard" | jq -r '.md5_url')"
            echo "::group::$id"
            # A retry is a full re-download + rebuild, not a resume: build-shard.sh
            # wipes its work dir on entry. It exists for transient failures.
            attempt=1
            max_attempts=2
            until tools/osm-world/ci/build-shard.sh \
                --kind density --id "$id" --pbf-url "$pbf_url" --md5-url "$md5_url"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::shard $id failed after $attempt attempt(s)"
                exit 1
              fi
              attempt=$((attempt + 1))
              echo "::warning::shard $id failed, retrying (attempt $attempt/$max_attempts)"
              sleep 10
            done
            echo "::endgroup::"
          done
