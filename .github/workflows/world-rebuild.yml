# .github/workflows/world-rebuild.yml — Phase 6 (see tools/osm-world/DESIGN.md
# §Phase 6). The orchestrator: one dispatch rebuilds the whole world with nothing
# left for a workstation —
#
#   world-feature-shards ─┐
#   world-density-shards ─┼──► world-merge
#   world-admin ──────────┘
#
# All four are reusable workflows (`workflow_call`) called on this ref with
# `secrets: inherit`; each keeps its own matrix, timeouts, retries and loud
# preflights — this file adds ONLY the ordering. The ordering is not cosmetic:
# the merge must see a COMPLETE, CONSISTENT shard set (its plan job hard-checks
# the R2 manifest set against shards.json in both directions), and running it
# before the shard workflows finish would fail that check — or worse, pass it
# against last month's shards. Which is also why nothing here passes
# skip_cover_check.
#
# Scale (2026-08-22 measured constants): 88 feature jobs (longest canada,
# 220.9 min) + 114 density jobs (longest 47 min) + 1 admin + ~42 merge jobs
# (35 layers + 4 density bands at the measured 119.47M cells + plan/assemble/
# finalize) ≈ 245 jobs. The two shard workflows run 20-parallel each — 40
# concurrent at the account ceiling — so expect ~4 h of shard phase (canada is
# the long pole), then the merge phase's ~2 h (green's merge is its long pole).
# Job-level 6 h caps apply per job; a workflow RUN may take much longer.
#
# The admin build runs every rebuild even though boundaries move on a timescale
# of years — it is minutes of work, and rebuilding it beats merging against a
# stale prefix nobody remembers refreshing. Its Overture release stays PINNED in
# world-admin.yml; a pruned release fails loudly there, naming what still exists.
#
# Each calling job carries a job-level `concurrency` group matching the called
# workflow's own group, so a rebuild queues behind (never races) a standalone
# dispatch of the same workflow. cancel-in-progress stays false everywhere: a
# half-cancelled shard wave leaves R2 half-updated, which the merge's cover
# check would then refuse.
#
# R2 secrets required (inherited by every called workflow):
#   R2_ACCOUNT_ID  R2_ACCESS_KEY_ID  R2_SECRET_ACCESS_KEY  R2_BUCKET
#
# NOT verified by running this file: I cannot execute GitHub Actions from here.
# YAML syntax was checked with PyYAML; reusable-workflow wiring is unverified
# until dispatched.

name: world-rebuild

on:
  # Dispatch only — the monthly cadence belongs to the shard workflows'
  # (currently disabled) schedules, and a full rebuild is deliberate.
  workflow_dispatch:
    inputs:
      world_prefix:
        description: "R2 prefix the merged world publishes under (default: world)"
        required: false
        default: "world"

concurrency:
  group: world-rebuild
  cancel-in-progress: false

jobs:
  feature-shards:
    uses: ./.github/workflows/world-feature-shards.yml
    secrets: inherit
    concurrency:
      group: world-feature-shards
      cancel-in-progress: false

  density-shards:
    uses: ./.github/workflows/world-density-shards.yml
    secrets: inherit
    concurrency:
      group: world-density-shards
      cancel-in-progress: false

  admin:
    uses: ./.github/workflows/world-admin.yml
    secrets: inherit
    concurrency:
      group: world-admin
      cancel-in-progress: false

  merge:
    needs: [feature-shards, density-shards, admin]
    uses: ./.github/workflows/world-merge.yml
    secrets: inherit
    concurrency:
      group: world-merge
      cancel-in-progress: false
    with:
      world_prefix: ${{ inputs.world_prefix || 'world' }}
