# .github/workflows/world-rebuild.yml — Phase 6 orchestrator (DESIGN.md §Phase 6):
# one dispatch rebuilds the whole world.
#
#   world-feature-shards ─┐
#   world-density-shards ─┼──► world-merge
#   world-admin ──────────┤
#   world-transit ────────┘
#
# All five are reusable workflows called on this ref with `secrets: inherit`; each
# keeps its own matrix, timeouts and preflights. This file adds only the ordering:
# the merge's plan job hard-checks the R2 manifest set against shards.json, so it
# must run after a complete shard wave (and never with skip_cover_check).
#
# Scale (2026-08-22): ~247 jobs. Shard phase ~4 h (canada is the long pole, 20-parallel
# per shard workflow), then merge ~2 h. Job caps are 6 h each; the run takes longer.
#
# Admin is rebuilt every time (minutes of work; its Overture release is pinned in
# world-admin.yml). Transit is chained because route relations go stale between
# rebuilds and a world merged against an old transit prefix looks fresh.
#
# Each calling job carries a job-level `concurrency` group matching the called
# workflow's, so a rebuild queues behind a standalone dispatch. cancel-in-progress
# stays false: a half-cancelled shard wave leaves R2 half-updated.
#
# R2 secrets required (inherited by every called workflow):
#   R2_ACCOUNT_ID  R2_ACCESS_KEY_ID  R2_SECRET_ACCESS_KEY  R2_BUCKET
#
# Reusable-workflow wiring is unverified until dispatched.

name: world-rebuild

on:
  # Dispatch only; a full rebuild is deliberate.
  workflow_dispatch:
    inputs:
      world_prefix:
        description: "R2 prefix the merged world publishes under (default: world)"
        required: false
        default: "world"

concurrency:
  group: world-rebuild
  cancel-in-progress: false

jobs:
  feature-shards:
    uses: ./.github/workflows/world-feature-shards.yml
    secrets: inherit
    concurrency:
      group: world-feature-shards
      cancel-in-progress: false

  density-shards:
    uses: ./.github/workflows/world-density-shards.yml
    secrets: inherit
    concurrency:
      group: world-density-shards
      cancel-in-progress: false

  admin:
    uses: ./.github/workflows/world-admin.yml
    secrets: inherit
    concurrency:
      group: world-admin
      cancel-in-progress: false

  transit:
    uses: ./.github/workflows/world-transit.yml
    secrets: inherit
    concurrency:
      group: world-transit
      cancel-in-progress: false

  merge:
    needs: [feature-shards, density-shards, admin, transit]
    uses: ./.github/workflows/world-merge.yml
    secrets: inherit
    concurrency:
      group: world-merge
      cancel-in-progress: false
    with:
      world_prefix: ${{ inputs.world_prefix || 'world' }}
