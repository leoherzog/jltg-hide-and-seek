# .github/workflows/world-feature-shards.yml — Phase 4 (DESIGN.md §Phase 4). Builds
# feature layers only (build.py --skip-density) for every "coarse" shard in
# tools/osm-world/shards.json and uploads each shard's output to R2 under
# shards/feature/<id>/.
#
# This workflow does not merge shards. Merge runs on kadro:
#
#   uv run tools/osm-world/merge.py --shards <dir with one subdir per shard build> \
#     --admin <overture admin.fgb> --out <dir>
#
# The R2 -> local-subdir handoff in world-density-shards.yml applies here with
# shards/feature/ in place of shards/density/.
#
# R2 secrets required:
#   R2_ACCOUNT_ID  R2_ACCESS_KEY_ID  R2_SECRET_ACCESS_KEY  R2_BUCKET
# The .dev.vars token lacks R2 write; a CI-scoped R2 token must be minted first.
#
# Cost model (DESIGN.md §Phase 4), confirmed by a full-scale run on 2026-08-22
# (87/87 jobs, zero failures):
#   - RAM peaked at 6.34 GB RSS, far under the runner's 15 GB; not the constraint.
#   - Disk: build-shard.sh passes --unlink-source, so build.py deletes the raw
#     extract once stage 1's filtered intermediate exists (feature shards never run
#     stage 4, the only later reader). That keeps peak at ~2.6x source, ~8.6 GB for
#     the largest coarse shard, hence one shard per matrix job (batch_size 1).
#   - ~60-70 coarse shards is far under the 256-matrix cap; chunk-shards.py is used
#     anyway so a cover.py re-run never requires touching this file.
#   - Public repos get unlimited included Actions minutes; check pricing for private.
#   - Concurrency defaults to 20 (Free-tier ceiling); raise if this repo has more.

name: world-feature-shards

on:
  # Schedule disabled until the R2_* secrets exist; every job would fail at upload.
  # Re-arm by uncommenting the two live lines (monthly, 06:00 UTC on the 4th,
  # offset from world-density-shards).
  # schedule:
  #   - cron: "0 6 4 * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Coarse shards per matrix job (default 1 — see disk note above)"
        required: false
        default: "1"
  # Callable from world-rebuild.yml, same input. `inputs.*` covers both triggers;
  # `github.event.inputs.*` would read the caller's dispatch inputs under workflow_call.
  workflow_call:
    inputs:
      batch_size:
        required: false
        type: string
        default: "1"

concurrency:
  group: world-feature-shards
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.chunk.outputs.matrix }}
      count: ${{ steps.chunk.outputs.count }}
    steps:
      - uses: actions/checkout@v7

      - name: runner envelope (this build depends on undocumented headroom)
        run: |
          set -euo pipefail
          echo "cores: $(nproc)   ram: $(free -g | awk '/^Mem:/{print $2}') GB"
          df -Pk . | awk 'NR==2{printf "disk: %.1f GB free of %.1f GB\n", $4/1048576, $2/1048576}'
          # GitHub documents 14 GB of runner storage but ships far more; printing it
          # every run makes a silent reversion visible before ENOSPC does.
          free_gb=$(df -Pk . | awk 'NR==2{print int($4/1048576)}')
          [ "$free_gb" -ge 20 ] || echo "::warning::only ${free_gb} GB free — large shards may not fit"


      - name: chunk shards.json into a matrix
        id: chunk
        env:
          BATCH_SIZE: ${{ inputs.batch_size || '1' }}
        run: |
          set -euo pipefail
          if [ ! -f tools/osm-world/shards.json ]; then
            echo "::error::tools/osm-world/shards.json not found — run cover.py (Phase 3) and commit it first"
            exit 1
          fi
          python3 tools/osm-world/ci/chunk-shards.py \
            --kind coarse \
            --batch-size "$BATCH_SIZE" \
            --max-jobs 256 \
            > matrix.json
          {
            echo "matrix<<CHUNKEOF"
            cat matrix.json
            echo "CHUNKEOF"
          } >> "$GITHUB_OUTPUT"
          echo "count=$(jq 'length' matrix.json)" >> "$GITHUB_OUTPUT"

      - name: summary
        run: |
          echo "### world-feature-shards" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.chunk.outputs.count }} batch job(s) from tools/osm-world/shards.json[\"coarse\"]" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build (${{ matrix.batch_id }})
    needs: setup
    runs-on: ubuntu-latest
    # Not generous: the worst real job used 92% of this, so a slower runner or a
    # grown extract will trip it.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: runner envelope (this build depends on undocumented headroom)
        run: |
          set -euo pipefail
          echo "cores: $(nproc)   ram: $(free -g | awk '/^Mem:/{print $2}') GB"
          df -Pk . | awk 'NR==2{printf "disk: %.1f GB free of %.1f GB\n", $4/1048576, $2/1048576}'
          # GitHub documents 14 GB of runner storage but ships far more; printing it
          # every run makes a silent reversion visible before ENOSPC does.
          free_gb=$(df -Pk . | awk 'NR==2{print int($4/1048576)}')
          [ "$free_gb" -ge 20 ] || echo "::warning::only ${free_gb} GB free — large shards may not fit"


      - name: check disk headroom
        run: |
          df -h "$GITHUB_WORKSPACE"

      - name: install osmium-tool, gdal, uv
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends osmium-tool gdal-bin time
          # Driver preflight: a GDAL can lack a driver build.py needs; fail by name now.
          # Plain grep, not -q: under pipefail -q's early exit SIGPIPEs ogrinfo.
          for drv in FlatGeobuf GeoJSONSeq; do
            ogrinfo --formats 2>/dev/null | grep "$drv" >/dev/null \
              || { echo "::error::this GDAL lacks the $drv driver"; exit 1; }
          done
          python3 -m pip install --user --upgrade uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: build + upload every shard in this batch
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BATCH_JSON: ${{ toJson(matrix.shards) }}
        run: |
          set -euo pipefail
          chmod +x tools/osm-world/ci/build-shard.sh

          missing=()
          for v in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            [ -n "${!v:-}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing secrets: ${missing[*]} — see this file's header comment (a CI R2 token must be minted; .dev.vars' token lacks R2 write)"
            exit 1
          fi

          echo "$BATCH_JSON" | jq -c '.[]' | while IFS= read -r shard; do
            id="$(echo "$shard" | jq -r '.id')"
            pbf_url="$(echo "$shard" | jq -r '.pbf_url')"
            md5_url="$(echo "$shard" | jq -r '.md5_url')"
            echo "::group::$id"
            # A retry is a full re-download + rebuild, not a resume: build-shard.sh
            # wipes its work dir on entry. It exists for transient failures.
            attempt=1
            max_attempts=2
            until tools/osm-world/ci/build-shard.sh \
                --kind feature --id "$id" --pbf-url "$pbf_url" --md5-url "$md5_url"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::shard $id failed after $attempt attempt(s)"
                exit 1
              fi
              attempt=$((attempt + 1))
              echo "::warning::shard $id failed, retrying (attempt $attempt/$max_attempts)"
              sleep 10
            done
            echo "::endgroup::"
          done
