# .github/workflows/feed-catalogue.yml — refresh data/feeds.json from the Mobility
# Database and measure each feed's size. The only workflow here that is not part
# of the OSM world build: one checkout, one Node, two commands, about four minutes.
#
#   node tools/mdb-snapshot.mjs --counts     rewrite data/feeds.json, then measure every feed
#   node tools/mdb-snapshot.mjs --check      re-validate the file from disk
#
# The second command re-reads the written file, which catches serialisation bugs the
# in-memory check would miss.
#
# It opens a pull request; it never pushes to main, because `data/feeds.json` is
# reviewed as a diff. `gh` is preinstalled on the runner and is the whole PR mechanism.
#
# Only a malformed file fails the job. An example map whose feed upstream has dropped,
# put behind a key or stopped updating is a warning on the run and in the PR body: the
# chip hides itself at runtime and returns on the first refresh after upstream recovers.
#
# Cadence: monthly on the 6th, clear of the 1st and of world-rebuild.yml (3rd).
# Nothing breaks if a month is missed.
#
# `--counts` reads three HTTP ranges per feed from MobilityData's mirror (~135 MB, ~2
# min for ~3,300 feeds). It is opt-in in the tool, so this workflow is what keeps the
# numbers current. A feed the mirror will not serve keeps its previous numbers and is
# marked `q`; the job fails only when `--check` does.
#
# YAML is unverified until dispatched.

name: feed-catalogue

on:
  workflow_dispatch:
    inputs:
      counts:
        description: "Measure each feed's stops and routes over the mirror (adds ~2 min)"
        required: false
        type: boolean
        default: true
      regional_km:
        description: "Box span above which a feed is long-distance and becomes opt-in"
        required: false
        type: string
        default: "250"
  schedule:
    # 06:00 UTC on the 6th.
    - cron: "0 6 6 * *"

concurrency:
  group: feed-catalogue
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # tools/ is documented against Node 24.
          node-version: "24"

      - name: rebuild the catalogue
        id: build
        env:
          # Scheduled runs always measure; a dispatch may opt out.
          COUNTS: ${{ github.event_name == 'schedule' && 'true' || inputs.counts }}
          REGIONAL_KM: ${{ inputs.regional_km || '250' }}
        run: |
          set -euo pipefail
          args=(--regional-km "$REGIONAL_KM")
          # `[ ... ] && ...` would exit the step under `set -e` when false; use `if`.
          if [ "$COUNTS" = "true" ]; then args+=(--counts); fi
          echo "::group::mdb-snapshot ${args[*]}"
          node tools/mdb-snapshot.mjs "${args[@]}" | tee /tmp/snapshot.log
          echo "::endgroup::"
          # The printed summary is the review aid; carry it into the PR body.
          sed -n '/feeds,.*bytes, snapshot/,$p' /tmp/snapshot.log > /tmp/summary.txt
          cat /tmp/summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: re-validate the written file
        run: |
          set -euo pipefail
          node tools/mdb-snapshot.mjs --check | tee /tmp/check.log
          sed -n 's/^WARN /::warning title=Example map hidden::/p' /tmp/check.log

      - name: open a pull request if anything moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- data/feeds.json; then
            echo "data/feeds.json is unchanged; nothing to open." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # One long-lived branch, force-pushed, so stale PRs do not pile up.
          branch=chore/feed-catalogue
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/feeds.json
          git commit -m "Refresh Feed Catalogue Snapshot" -m "$(cat /tmp/summary.txt)"
          git push --force origin "$branch"

          body="$(printf '%s\n\n```\n%s\n```\n\n%s\n' \
            'Regenerated by `.github/workflows/feed-catalogue.yml` from the Mobility Database CSV.' \
            "$(cat /tmp/summary.txt)" \
            'Read the diff, not just the summary — `data/feeds.json` is one JSON object per line so a moved bounding box or a resized system shows as its own changed line.')"
          if grep -q '^WARN ' /tmp/check.log; then
            body+=$'\n\n**Example maps hidden.** Each `WARN` line is a chip the landing page stops offering once this merges. It returns on its own when the feed recovers upstream; to swap or drop a feed instead, edit `EXAMPLE_MAPS` in `lib/catalog.js`.'
          fi

          # A force-push leaves an open PR's body describing the previous run, so rewrite it.
          if gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -qx OPEN; then
            gh pr edit "$branch" --body "$body"
            echo "Updated the open PR on $branch." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr create \
            --base "${{ github.ref_name }}" \
            --head "$branch" \
            --title "Refresh Feed Catalogue Snapshot" \
            --body "$body"
