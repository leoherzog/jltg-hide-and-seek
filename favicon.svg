<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="Hide+Seek">
<!--
  favicon.svg — the plane-mosaic glyph on the brand plate.

  Colours are the two hexes styles.css calls "the logo" (§2, line 125): gold
  #ffbf40 on navy #202f40, 8.29:1. They are literals, not var()s — a favicon is
  fetched as a standalone document, so it inherits nothing from styles.css.

  Glyph: Font Awesome Pro 7.3.1 `plane-mosaic`, solid. Its ink spans 64…560 ×
  80…576 of the 640 box, so its centre is (312, 328), not (320, 320); the
  transform scales about that centre and re-centres on the plate, leaving even
  ~16% margin on all four sides. Nudging the scale is the only knob — change it
  and the translate must be recomputed: t = 320 − s·(312, 328).

  Dark scheme lifts the plate one step (#2f3f50, the dark theme's lowered
  surface) so the tile still reads as a tile against a dark tab strip; navy at
  #202f40 is darker than every browser's dark chrome and dissolves into it.
-->
